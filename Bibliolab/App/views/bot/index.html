<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Chatbot com Gemini</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/chatbot.css">
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">🤖 Chatbot de Ajuda (Gemini)</div>
    <div class="chat-body" id="chat-body">
      <div class="bot-message chat-message">
        Olá! Eu sou seu assistente. Como posso ajudar hoje?
      </div>
    </div>
    <div class="chat-footer d-flex">
      <input id="pergunta" type="text" class="form-control me-2" placeholder="Digite sua mensagem...">
      <button class="btn btn-info text-white" onclick="perguntar()">Enviar</button>
    </div>
  </div>

  <script src="js/chatbot.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
